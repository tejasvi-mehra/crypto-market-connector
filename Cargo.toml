[package]
name = "crypto-market-connector"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
chrono = "0.4.44"
envy = "0.4.2"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.1", features = ["full"] }
binance-sdk = { version = "46.0.0", features = ["spot"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
reqwest = { version = "0.13.2", features = ["json", "query"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.10"
serde_with = "3.18.0"
coinbase-v3 = "0.1.1"
coinbase-advanced = "1.0.0"
